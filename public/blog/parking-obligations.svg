<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="720" height="620" rx="32" fill="#f1f9fb"/>
  <text x="40" y="66" font-size="27" font-weight="700" fill="#032b60" text-anchor="start">Parking d'hôtel, de commerce ou de bureaux</text>
  <text x="40" y="98" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Votre situation, et ce qui s'applique</text>
  <rect x="40" y="128" width="270" height="118" rx="18" fill="#ffffff" stroke="#d6e9ee" stroke-width="2"/>
  <text x="175" y="180" font-size="18" font-weight="700" fill="#032b60" text-anchor="middle">Parking neuf ou rénové,</text>
  <text x="175" y="206" font-size="18" font-weight="700" fill="#032b60" text-anchor="middle">plus de 10 places</text>
  <path d="M 322 187 L 352 187" stroke="#0097b2" stroke-width="4" stroke-linecap="round"/>
  <path d="M 344 177 L 358 187 L 344 197" fill="none" stroke="#0097b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="370" y="128" width="310" height="118" rx="18" fill="#0097b2"/>
  <text x="525" y="180" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">20 % des places pré-équipées,</text>
  <text x="525" y="206" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">au moins 1 place PMR équipée</text>
  <rect x="40" y="278" width="270" height="118" rx="18" fill="#ffffff" stroke="#d6e9ee" stroke-width="2"/>
  <text x="175" y="330" font-size="18" font-weight="700" fill="#032b60" text-anchor="middle">Parking existant, plus de</text>
  <text x="175" y="356" font-size="18" font-weight="700" fill="#032b60" text-anchor="middle">20 places (hors PME)</text>
  <path d="M 322 337 L 352 337" stroke="#0097b2" stroke-width="4" stroke-linecap="round"/>
  <path d="M 344 327 L 358 337 L 344 347" fill="none" stroke="#0097b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="370" y="278" width="310" height="118" rx="18" fill="#0097b2"/>
  <text x="525" y="330" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1 point PMR + 1 point</text>
  <text x="525" y="356" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">par tranche de 20 places</text>
  <rect x="40" y="428" width="270" height="118" rx="18" fill="#ffffff" stroke="#d6e9ee" stroke-width="2"/>
  <text x="175" y="480" font-size="18" font-weight="700" fill="#032b60" text-anchor="middle">Borne ouverte aux clients</text>
  <text x="175" y="506" font-size="18" font-weight="700" fill="#032b60" text-anchor="middle">et payante (moins de 50 kW)</text>
  <path d="M 322 487 L 352 487" stroke="#0097b2" stroke-width="4" stroke-linecap="round"/>
  <path d="M 344 477 L 358 487 L 344 497" fill="none" stroke="#0097b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="370" y="428" width="310" height="118" rx="18" fill="#0097b2"/>
  <text x="525" y="466" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Paiement sans abonnement</text>
  <text x="525" y="490" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">(QR code possible), prix</text>
  <text x="525" y="514" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">affiché avant la charge</text>
  <text x="40" y="590" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">Sources : CCH art. L113-12 et L113-13, règlement (UE) 2023/1804 (AFIR), art. 5.</text>
</svg>
