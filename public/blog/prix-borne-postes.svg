<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" width="720" height="780" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="720" height="780" rx="32" fill="#f1f9fb"/>
  <text x="40" y="66" font-size="30" font-weight="700" fill="#032b60">Ce qui fait varier le prix</text>
  <text x="40" y="102" font-size="20" fill="#64748b">Poids indicatif de chaque poste dans un devis de borne</text>

  <text x="40" y="170" font-size="24" font-weight="700" fill="#032b60">1. Distance et passage du câble</text>
  <text x="40" y="198" font-size="20" fill="#475569">Apparent, encastré, vide sanitaire, tranchée</text>
  <rect x="40" y="214" width="640" height="18" rx="9" fill="#e2e8f0"/>
  <rect x="40" y="214" width="600" height="18" rx="9" fill="#FF6B00"/>

  <text x="40" y="290" font-size="24" font-weight="700" fill="#032b60">2. Choix de la borne</text>
  <text x="40" y="318" font-size="20" fill="#475569">Entrée de gamme pilotable ou modèle connecté</text>
  <rect x="40" y="334" width="640" height="18" rx="9" fill="#e2e8f0"/>
  <rect x="40" y="334" width="520" height="18" rx="9" fill="#0097b2"/>

  <text x="40" y="410" font-size="24" font-weight="700" fill="#032b60">3. Tableau électrique</text>
  <text x="40" y="438" font-size="20" fill="#475569">Protections dédiées, remise à niveau, terre</text>
  <rect x="40" y="454" width="640" height="18" rx="9" fill="#e2e8f0"/>
  <rect x="40" y="454" width="380" height="18" rx="9" fill="#0097b2"/>

  <text x="40" y="530" font-size="24" font-weight="700" fill="#032b60">4. Gestion de la puissance</text>
  <text x="40" y="558" font-size="20" fill="#475569">Délesteur ou hausse d'abonnement</text>
  <rect x="40" y="574" width="640" height="18" rx="9" fill="#e2e8f0"/>
  <rect x="40" y="574" width="240" height="18" rx="9" fill="#0097b2"/>

  <text x="40" y="650" font-size="24" font-weight="700" fill="#032b60">5. Percements et finitions</text>
  <text x="40" y="678" font-size="20" fill="#475569">Béton, pierre, dalle, goulottes</text>
  <rect x="40" y="694" width="640" height="18" rx="9" fill="#e2e8f0"/>
  <rect x="40" y="694" width="200" height="18" rx="9" fill="#0097b2"/>

  <text x="40" y="756" font-size="18" fill="#94a3b8">Plus la barre est longue, plus le poste pèse</text>
  <text x="680" y="756" font-size="18" fill="#94a3b8" text-anchor="end">chargeo.fr</text>
</svg>
