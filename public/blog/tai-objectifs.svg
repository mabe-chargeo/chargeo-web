<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="720" height="600" rx="32" fill="#f1f9fb"/>
  <text x="40" y="66" font-size="27" font-weight="700" fill="#032b60" text-anchor="start">Part minimale de véhicules à faibles émissions</text>
  <text x="40" y="98" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Objectif de la taxe annuelle incitative (TAI), flottes de 100 véhicules et plus</text>
  <rect x="56" y="380" width="74" height="90" rx="10" fill="#0097b2"/>
  <text x="93" y="366" font-size="24" font-weight="700" fill="#0097b2" text-anchor="middle">15 %</text>
  <text x="93" y="502" font-size="20" font-weight="700" fill="#032b60" text-anchor="middle">2025</text>
  <rect x="164" y="362" width="74" height="108" rx="10" fill="#032b60"/>
  <text x="201" y="348" font-size="24" font-weight="700" fill="#032b60" text-anchor="middle">18 %</text>
  <text x="201" y="502" font-size="20" font-weight="700" fill="#032b60" text-anchor="middle">2026</text>
  <rect x="272" y="320" width="74" height="150" rx="10" fill="#0097b2"/>
  <text x="309" y="306" font-size="24" font-weight="700" fill="#0097b2" text-anchor="middle">25 %</text>
  <text x="309" y="502" font-size="20" font-weight="700" fill="#032b60" text-anchor="middle">2027</text>
  <rect x="380" y="290" width="74" height="180" rx="10" fill="#0097b2"/>
  <text x="417" y="276" font-size="24" font-weight="700" fill="#0097b2" text-anchor="middle">30 %</text>
  <text x="417" y="502" font-size="20" font-weight="700" fill="#032b60" text-anchor="middle">2028</text>
  <rect x="488" y="260" width="74" height="210" rx="10" fill="#0097b2"/>
  <text x="525" y="246" font-size="24" font-weight="700" fill="#0097b2" text-anchor="middle">35 %</text>
  <text x="525" y="502" font-size="20" font-weight="700" fill="#032b60" text-anchor="middle">2029</text>
  <rect x="596" y="182" width="74" height="288" rx="10" fill="#0097b2"/>
  <text x="633" y="168" font-size="24" font-weight="700" fill="#0097b2" text-anchor="middle">48 %</text>
  <text x="633" y="502" font-size="20" font-weight="700" fill="#032b60" text-anchor="middle">2030</text>
  <line x1="40" y1="470" x2="680" y2="470" stroke="#94a3b8" stroke-width="2"/>
  <text x="40" y="548" font-size="18" font-weight="700" fill="#032b60" text-anchor="start">Tarif de calcul : 2 000 € en 2025, 4 000 € en 2026, 5 000 € à partir de 2027.</text>
  <text x="40" y="576" font-size="16" font-weight="400" fill="#64748b" text-anchor="start">La taxe est nulle si l'objectif est atteint. Sources : CIBS, art. L421-132-3 et L421-132-4.</text>
</svg>
