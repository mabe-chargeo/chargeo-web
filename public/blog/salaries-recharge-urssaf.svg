<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" width="720" height="760" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="720" height="760" rx="32" fill="#f1f9fb"/>
  <text x="40" y="66" font-size="27" font-weight="700" fill="#032b60" text-anchor="start">Recharge des salariés : ce que dit l'Urssaf</text>
  <text x="40" y="98" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Les trois situations les plus courantes en 2026</text>
  <rect x="40" y="126" width="640" height="176" rx="20" fill="#ffffff" stroke="#d6e9ee" stroke-width="2"/>
  <circle cx="82" cy="168" r="22" fill="#0097b2"/>
  <text x="82" y="176" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="118" y="176" font-size="22" font-weight="700" fill="#032b60" text-anchor="start">Borne sur le parking de l'entreprise</text>
  <text x="64" y="218" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Le salarié recharge gratuitement</text>
  <text x="64" y="244" font-size="18" font-weight="400" fill="#475569" text-anchor="start">sa voiture personnelle.</text>
  <rect x="430" y="204" width="230" height="78" rx="14" fill="#032b60"/>
  <text x="545" y="236" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Pas d'avantage en nature</text>
  <text x="545" y="260" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">jusqu'au 31/12/2027</text>
  <rect x="40" y="326" width="640" height="176" rx="20" fill="#ffffff" stroke="#d6e9ee" stroke-width="2"/>
  <circle cx="82" cy="368" r="22" fill="#0097b2"/>
  <text x="82" y="376" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="118" y="376" font-size="22" font-weight="700" fill="#032b60" text-anchor="start">Borne posée chez le salarié</text>
  <text x="64" y="418" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Retirée à son départ : pas d'avantage.</text>
  <text x="64" y="444" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Laissée : exonérée jusqu'à 50 %</text>
  <text x="64" y="470" font-size="18" font-weight="400" fill="#475569" text-anchor="start">des dépenses et 1 057,10 € (2026).</text>
  <rect x="430" y="404" width="230" height="78" rx="14" fill="#032b60"/>
  <text x="545" y="436" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Seul le dépassement</text>
  <text x="545" y="460" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">est un avantage</text>
  <rect x="40" y="526" width="640" height="176" rx="20" fill="#ffffff" stroke="#d6e9ee" stroke-width="2"/>
  <circle cx="82" cy="568" r="22" fill="#0097b2"/>
  <text x="82" y="576" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="118" y="576" font-size="22" font-weight="700" fill="#032b60" text-anchor="start">Véhicule de fonction rechargé à la maison</text>
  <text x="64" y="618" font-size="18" font-weight="400" fill="#475569" text-anchor="start">L'électricité payée par l'entreprise</text>
  <text x="64" y="644" font-size="18" font-weight="400" fill="#475569" text-anchor="start">n'entre pas dans l'avantage.</text>
  <rect x="430" y="604" width="230" height="78" rx="14" fill="#032b60"/>
  <text x="545" y="636" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Badge RFID + relevé</text>
  <text x="545" y="660" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">= remboursement au réel</text>
  <text x="40" y="734" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">Montants 2026 pour une borne de moins de 5 ans. À valider avec votre expert-comptable.</text>
</svg>
